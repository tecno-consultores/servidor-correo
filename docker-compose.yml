services:
  mailserver:
    image: analogic/poste.io:latest
    container_name: mailserver
    hostname: mail.example.com
    tty: true
    restart: always
    network_mode: host
    ports:
      - 25:25
      - 80:80
      - 110:110
      - 143:143
      - 443:443
      - 465:465
      - 587:587
      - 993:993
      - 995:995
      - 4190:4190
    environment:
      - LETSENCRYPT_EMAIL=admin@example.com
      - LETSENCRYPT_HOST=mail.example.com
      - VIRTUAL_HOST=mail.example.com
      - HTTPS=OFF
      - TZ=America/Caracas
      - DISABLE_CLAMAV=false
      - DISABLE_RSPAMD=false
      - DISABLE_ROUNDCUBE=false
      - HTTP_PORT=80
      - HTTPS_PORT=443
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/data
